<!DOCTYPE html>
<html>
<head>
  <title>Gerador de Sons Essentia</title>
</head>
<body>
  <h1>Gerador de Sons para Essentia</h1>
  <button onclick="generateClick()">Gerar ui_click.mp3</button>
  <button onclick="generateSuccess()">Gerar ui_success.mp3</button>
  
  <script>
    // Função auxiliar para criar e baixar áudio
    async function createAndDownload(audioBuffer, filename) {
      const wavBlob = audioBufferToWav(audioBuffer);
      const url = URL.createObjectURL(wavBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
    }

    // Converte AudioBuffer para WAV
    function audioBufferToWav(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const format = 1; // PCM
      const bitDepth = 16;
      
      const bytesPerSample = bitDepth / 8;
      const blockAlign = numChannels * bytesPerSample;
      
      const data = new Float32Array(buffer.length * numChannels);
      for (let i = 0; i < buffer.length; i++) {
        for (let channel = 0; channel < numChannels; channel++) {
          data[i * numChannels + channel] = buffer.getChannelData(channel)[i];
        }
      }
      
      const dataLength = data.length * bytesPerSample;
      const bufferLength = 44 + dataLength;
      const arrayBuffer = new ArrayBuffer(bufferLength);
      const view = new DataView(arrayBuffer);
      
      // WAV header
      const writeString = (offset, string) => {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      };
      
      writeString(0, 'RIFF');
      view.setUint32(4, 36 + dataLength, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, format, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitDepth, true);
      writeString(36, 'data');
      view.setUint32(40, dataLength, true);
      
      // Write audio data
      let offset = 44;
      for (let i = 0; i < data.length; i++) {
        const sample = Math.max(-1, Math.min(1, data[i]));
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
        offset += 2;
      }
      
      return new Blob([arrayBuffer], { type: 'audio/wav' });
    }

    // Gera som de clique (tick curto)
    async function generateClick() {
      const audioContext = new AudioContext();
      const sampleRate = audioContext.sampleRate;
      const duration = 0.08;
      const audioBuffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate);
      const channelData = audioBuffer.getChannelData(0);
      
      // Gera um tick com envelope ADSR
      for (let i = 0; i < channelData.length; i++) {
        const t = i / sampleRate;
        const envelope = Math.exp(-t * 50);
        const freq = 800 + (400 * Math.exp(-t * 20));
        channelData[i] = Math.sin(2 * Math.PI * freq * t) * envelope * 0.3;
      }
      
      await createAndDownload(audioBuffer, 'ui_click.wav');
      alert('ui_click.wav gerado! Converta para MP3 online.');
    }

    // Gera som de sucesso (sino suave)
    async function generateSuccess() {
      const audioContext = new AudioContext();
      const sampleRate = audioContext.sampleRate;
      const duration = 0.5;
      const audioBuffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate);
      const channelData = audioBuffer.getChannelData(0);
      
      // Gera harmônicos de sino
      const frequencies = [523.25, 659.25, 783.99]; // C5, E5, G5
      for (let i = 0; i < channelData.length; i++) {
        const t = i / sampleRate;
        const envelope = Math.exp(-t * 4);
        let sample = 0;
        frequencies.forEach((freq, idx) => {
          sample += Math.sin(2 * Math.PI * freq * t) * envelope * (1 / (idx + 1)) * 0.2;
        });
        channelData[i] = sample;
      }
      
      await createAndDownload(audioBuffer, 'ui_success.wav');
      alert('ui_success.wav gerado! Converta para MP3 online.');
    }
  </script>
</body>
</html>
